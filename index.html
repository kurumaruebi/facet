<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Facet deterministic IR renderer" />
    <title>Facet Renderer</title>
  </head>
  <body>
    <main id="app" class="host-shell" data-raw-visible="true">
      <nav class="host-nav">
        <div class="host-brand">
          <span class="host-brand__mark">F</span>
          <div>
            <h1>Facet renderer</h1>
            <p>Typed IR in. Deterministic interface out.</p>
          </div>
        </div>
        <div class="host-actions">
          <div class="host-live-prompt">
            <input id="live-input" class="host-input" type="text" placeholder="Prompt for live UI..." aria-label="Live prompt input" />
            <button id="live-emit" class="host-button" type="button">Emit & Render</button>
          </div>
          <label class="host-select">
            <span>Demo</span>
            <select id="demo-select">
              <option value="gstack">gstack</option>
              <option value="linzumi">Linzumi</option>
              <option value="crustdata">Crustdata</option>
              <option value="jinba">Jinba</option>
              <option value="agent_scrub">Agent Scrub</option>
            </select>
          </label>
          <button id="fallback-demo" class="host-button" type="button">Test fallback</button>
          <label class="host-toggle">
            <input id="raw-toggle" type="checkbox" checked />
            Show raw IR
          </label>
        </div>
      </nav>
      <div class="host-board">
        <section id="rendered" aria-label="Rendered Facet interface"></section>
        <div class="host-right-panel">
          <div class="host-tabs">
            <button id="tab-raw" class="host-tab active" type="button">Raw IR</button>
            <button id="tab-tree" class="host-tab" type="button">Composition Tree</button>
          </div>
          <pre id="raw" class="host-raw" aria-label="Raw Facet IR"></pre>
          <div id="tree-view" class="host-tree-view" aria-label="Composition Tree" style="display: none;"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/demo.js"></script>
  </body>
</html>
